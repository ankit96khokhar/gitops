apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage
  namespace: istio-testing-prod
spec:
  hosts:
  - "localhost"
  gateways:
  - gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: productpage.istio-testing-prod.svc.cluster.local
        port:
          number: 9080