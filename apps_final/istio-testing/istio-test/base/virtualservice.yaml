apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage
  namespace: istio-testing-prod
spec:
  hosts:
  - "localhost"
  gateways:
  - istio-testing-prod/prod-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: prod-productpage
        port:
          number: 9080